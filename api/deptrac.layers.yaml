deptrac:
  paths:
    - ./app

  layers:
    - name: Exceptions
      collectors:
        - { type: classLike, value: '^App\\Exceptions\\' }
    - name: Requests
      collectors:
        - { type: classLike, value: '^App\\(?:Modules\\[^\\]+\\)?Http\\Requests\\' }
    - name: Controllers
      collectors:
        - { type: classLike, value: '^App\\(?:Modules\\[^\\]+\\)?Http\\Controllers\\' }
    - name: Resources
      collectors:
        - { type: classLike, value: '^App\\(?:Modules\\[^\\]+\\)?Http\\Resources\\' }
    - name: ViewModels
      collectors:
        - { type: classLike, value: '^App\\(?:Modules\\[^\\]+\\)?Http\\ViewModels\\' }
    - name: Actions
      collectors:
        - { type: classLike, value: '^App\\(?:Modules\\[^\\]+\\)?Actions\\' }
    - name: Repositories
      collectors:
        - { type: classLike, value: '^App\\(?:Modules\\[^\\]+\\)?Repositories\\' }
    - name: Models
      collectors:
        - { type: classLike, value: '^App\\(?:Modules\\[^\\]+\\)?Models\\' }
    - name: Data
      collectors:
        - { type: classLike, value: '^App\\(?:Modules\\[^\\]+\\)?Data\\' }
    - name: Providers
      collectors:
        - { type: classLike, value: '^App\\Providers\\' }
    - name: LaravelPersistence
      collectors:
        - { type: classLike, value: '^Illuminate\\(?:Database\\|Support\\Facades\\(?:DB|Schema)$)' }
        - { type: classLike, value: '^(?:DB|Schema)$' }
    - name: Laravel
      collectors:
        - type: bool
          must:
            - { type: classLike, value: '^(Illuminate|Laravel)\\' }
          must_not:
            - { type: layer, value: LaravelPersistence }
    - name: UnclassifiedApp
      collectors:
        - type: bool
          must:
            - { type: classLike, value: '^App\\' }
          must_not:
            - { type: layer, value: Requests }
            - { type: layer, value: Exceptions }
            - { type: layer, value: Controllers }
            - { type: layer, value: Resources }
            - { type: layer, value: ViewModels }
            - { type: layer, value: Actions }
            - { type: layer, value: Repositories }
            - { type: layer, value: Models }
            - { type: layer, value: Data }
            - { type: layer, value: Providers }

  ruleset:
    Exceptions: [Laravel]
    Requests: [Data, Laravel]
    Controllers: [Requests, Actions, Resources, ViewModels, Laravel]
    Resources: [Data, Laravel]
    ViewModels: [Models, Data, Laravel]
    Actions: [Repositories, Data, Exceptions, Laravel, LaravelPersistence]
    Repositories: [Models, Data, Laravel, LaravelPersistence]
    Models: [Data, Laravel, LaravelPersistence]
    Data: []
    Providers: [Requests, Controllers, Resources, ViewModels, Actions, Repositories, Models, Data, Laravel, LaravelPersistence]
    UnclassifiedApp: []
